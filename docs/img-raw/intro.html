<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Column Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #131312;

            color: #f0f6fc;
        }
        
        .table {
            padding: 80px;
        }
        
        .subheading {
            line-height: 1.6;
            margin-right: 40px;
            margin-top: 20px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <table class="table"><tr><td width="30%">

        <h2>Claude forgets
        <br/>Your project shouldn't</h2>

        <br/>
        <p class="subheading">A Claude Code plugin for structured software delivery - Agents implement from a backlog, context is externalised from sessions, and your project keeps moving whether Claude remembers or not.</p>
    </td><td width="70%">
        <img src="/docs/img/ephemeral-orchestration_transparent.png" width="100%"/>
    </td></tr></table>
</body>
</html>
